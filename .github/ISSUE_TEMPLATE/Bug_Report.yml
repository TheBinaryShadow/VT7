name: Bug report
description: Report reproducible incorrect behavior in VT7
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping VT7 become dependable on Windows 7.

        VT7 is pre-alpha. Please search existing issues before reporting a problem. Do not include passwords, private keys, hostnames, usernames, or other sensitive data.

  - type: input
    id: vt7_version
    attributes:
      label: VT7 version or commit
      description: Include version, configuration, native ABI and full commit/dirty state where known. For an engineering package, include its filename and SHA256 if available.
      placeholder: VT7 0.3.5 Release x64, ABI 8, exact package filename and hash
    validations:
      required: true

  - type: dropdown
    id: machine_type
    attributes:
      label: Test environment
      options:
        - Physical Windows 7 machine
        - VMware virtual machine
        - VirtualBox virtual machine
        - Hyper-V virtual machine
        - QEMU or another virtual machine
        - Newer Windows used for development
        - Other
    validations:
      required: true

  - type: textarea
    id: windows
    attributes:
      label: Windows configuration
      description: Include edition, Service Pack, x64 or x86, language, and update tier. Output from `ver` and relevant lines from `systeminfo` are useful.
      placeholder: |
        Windows 7 Professional SP1 x64, English
        Tier A prerequisites installed
        Platform Update KB2670838 installed
    validations:
      required: true

  - type: textarea
    id: updates
    attributes:
      label: Relevant Windows updates
      description: List the VT7 prerequisites and any later NT 6.1 update set. You can use `wmic qfe get HotFixID,InstalledOn`, but trim the output to relevant information.
    validations:
      required: false

  - type: textarea
    id: graphics
    attributes:
      label: Graphics configuration
      description: Include GPU, driver version, Direct3D hardware or WARP path, monitor layout, DPI scaling, and Remote Desktop use where relevant.
      placeholder: NVIDIA GeForce GTX 750 Ti, driver 474.11, hardware D3D11, one monitor at 100 percent DPI
    validations:
      required: false

  - type: input
    id: shell
    attributes:
      label: Shell or remote application
      description: Include the exact version where possible. For current static viewport or native comparison tests, enter not applicable; local shells and SSH are not integrated yet.
      placeholder: PowerShell 7.2.24 x64 with PSReadLine 2.1.0
    validations:
      required: false

  - type: input
    id: backend
    attributes:
      label: Session backend
      description: State the actual test/renderer mode. Distinguish the WPF viewport from the separate native-only resource control. Do not label a static proof as WinPTY or SSH testing.
      placeholder: Static WPF viewport, atlas-d3d-warp, lifecycle profile
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Extract the exact engineering package into a fresh folder.
        2. Run the named launcher or command with these arguments...
        3. Describe the failure, exit code, interruption and complete or partial logs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete named logs and progress files, including failures, exit status and which profiles were not run. Measurement completion is not stability acceptance. Review files for personal information first.
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Last known working version
      description: If this is a regression, identify the last working VT7 commit or build.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing VT7 issues for this problem.
          required: true
        - label: I removed passwords, keys, hostnames, usernames, and other sensitive data.
          required: true
        - label: I understand that success on newer Windows does not establish Windows 7 compatibility.
          required: true
